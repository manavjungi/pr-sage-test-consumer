name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI code review
        uses: manavjungi/PR_Sage@v1
        with:
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
